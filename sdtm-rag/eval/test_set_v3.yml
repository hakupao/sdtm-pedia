# ════════════════════════════════════════════════════════════════════════
# Test Set v3 — 140 questions (= v2's 102 preserved verbatim + 38 new q103-q140)
# Created 2026-06-12. Purpose: (a) margin on cross_domain (25->50 q: one miss
#   no longer decides the >=95% gate), (b) long-name single_domain probes
#   q128-q140 (domain referenced ONLY by long name, no code token, no variable
#   names) to exercise the S3 long-name channel end-to-end for the first time.
# Category totals (v3): single_domain (40) / cross_domain (50) / concept (25) / mixed (25)
# Authoring process (anti-overfitting, same as v2): 7 writer agents blind to the
#   retrieval implementation (read knowledge_base/ only), 5 cross themes
#   (var-distribution / codelist-sharing / relationship-machinery / model-concepts
#   / domain-pairs) + 2 long-name single batches; each batch then audited by an
#   independent scientist agent (Rule D) who re-opened every gold file: 37 PASS +
#   1 FIX (q128 facts completed with VSSTRESC) + 0 REJECT. Programmatic check:
#   all facts verbatim-in-gold, all sources exist, no domain-code/variable token
#   in q128-q140 question text. Full audit trail:
#   evidence/checkpoints/testset_v3_authoring_audit.json
# Long-name probe design (q128-q140): 10 names expected to be S3-matchable
#   (multi-word or single word >=10 chars); 3 deliberate boundary probes
#   q134 "Concomitant Medications" (VARIABLE_INDEX long name is
#   "Concomitant/Prior Medications" - natural phrasing differs), q139 "Exposure"
#   + q140 "Comments" (short single words excluded by the S3 collision guard).
#   Boundary probes are honest: they may fail; failures document the boundary.
# ════════════════════════════════════════════════════════════════════════

# Test Set v2 — 102 questions (= v1's 53 preserved verbatim + 49 new)
# Format: id / category / question / expected_facts (substring match) / expected_sources (partial path match)
# Category totals (v2): single_domain (27) / cross_domain (25) / concept (25) / mixed (25)
# v1 block (q01-q48, s01-s05) is unchanged below; new questions (q54-q102) appended at the end.
# Every new expected_sources path was opened and content-verified against the KB (see audit note at EOF).
# mixed purity (v2 revision): all mixed questions require a value/term that lives ONLY in a
#   terminology file (not the codelist code printed in spec.md), forcing a genuine ≥2-source answer.
# Original v1 header (Phase 1D): overall ≥ 85%, RELATION (cross_domain) recall → Phase 2 KG gate
# Scientist-authored questions (s01-s05) merged separately for Rule A 4.c

