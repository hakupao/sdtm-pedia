# v2 GOLD AUDIT NOTE (self-check per Rule A)
# Each new question's expected_sources file was opened and the expected_facts
# were grep-confirmed present in that file. Flagged-for-recheck items:
#  - q63/q64/q65/q72: facts are lowercased substrings of the structure line /
#    prose (e.g. "one record per characteristic", "concentration", "parameter").
#    Match is case-insensitive per format spec; confirmed present but phrasing-
#    dependent, so re-verify if the matcher becomes case-sensitive.
#  - q92: "HISPANIC OR LATINO" lives in terminology/core/dm.md (codelist C66790);
#    DM/spec.md supplies ETHNIC + C66790 only. Both gold files needed together.
#
# MIXED-PURITY REVISION (post audit feedback): mixed questions previously asked
# only for the codelist *code*, which is printed in spec.md's "Controlled Terms:"
# field → single-source answerable (false mixed). Each mixed question now also asks
# for an actual codelist *value/term*, and — critically — that value was chosen so it
# does NOT appear in the domain spec.md (many spec CDISC Notes leak example values like
# 'Examples: "ORAL", "INTRAVENOUS"'; those leaking values were deliberately avoided).
# A second-source-forcing value lives ONLY in the terminology file. All values were
# opened against the actual codelist table before use:
#   q90 EXROUTE  C66729  -> terminology/core/interventions.md (SUBCUTANEOUS, INTRAMUSCULAR)  [spec leaks ORAL/INTRAVENOUS -> avoided]
#   q91 DSDECOD  C66727  -> terminology/core/disposition.md (WITHDRAWAL BY SUBJECT, PHYSICIAN DECISION)  [spec leaks LOST TO FOLLOW-UP -> avoided]
#   q92 ETHNIC   C66790  -> terminology/core/dm.md (HISPANIC OR LATINO)
#   q93 EXDOSFRM C66726  -> terminology/core/interventions.md (CAPSULE, INJECTION)  [spec leaks TABLET/LOTION -> avoided]
#   q94 LBSTRESC C102580 -> terminology/core/lb_part4.md (NEGATIVE, POSITIVE)
#   q95 DDTEST   C116107 -> terminology/core/other_part4.md (Primary Cause of Death, Age at Death)
#   q96 FATEST   C101833 -> terminology/core/findings_about.md (Diameter, Cumulative Exposure)
#   q97 SSSTRESC C124304 -> terminology/core/other_part5.md (ALIVE, DEAD)  [re-angled from TI/IECAT, whose only 2 values INCLUSION/EXCLUSION are unavoidable substrings of TI spec prose]
#   q98 CMDOSU   C71620  -> terminology/core/general_part5.md (IU, mEq)  [spec leaks ng/mg/mg-per-kg -> avoided]
#   q99 QSCAT    C100129 -> terminology/core/qs_part1.md (ACQ, ACT)  [re-angled from QSORRESU to avoid duplicating q98's C71620]
#   q101 TSPARM  C67152  -> terminology/core/trial_design.md (Actual Number of Subjects, Clinical Study Sponsor)
# q100 (TA ARMCD/ETCD: sponsor-defined, no CT codelist) reclassified mixed -> single_domain.
# q102 (VS VSPOS C71148 -> terminology/core/interventions.md, PRONE, FOWLERS) added new to
