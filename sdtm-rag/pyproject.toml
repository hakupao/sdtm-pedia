[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdtm-rag"
version = "0.1.0a0"
description = "SDTM Knowledge Base RAG + Dataset Validation Service (Phase 7)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — internal" }
authors = [{ name = "Bojiang Zhang" }]
keywords = ["sdtm", "rag", "chroma", "litellm", "validation"]

dependencies = [
    # Vector store
    "chromadb>=0.5.0",
    # Lexical retrieval (S2 hybrid BM25; pure-CPU arithmetic, no neural model)
    "bm25s>=0.3.9",
    # LLM abstraction
    "litellm>=1.85.1",
    "openai>=1.50",
    "anthropic>=0.40",
    # Tokenization
    "tiktoken>=0.7",
    # Web layer
    "fastapi>=0.115",
    # Security floor for the starlette transitive dep (FastAPI re-exports it; the phase-3
    # login gate rides on starlette SessionMiddleware + ASGI). pip-audit 2026-06-16 flagged
    # CVE-2026-54282 (fix 1.3.0) + CVE-2026-54283 (fix 1.3.1) in 1.2.1.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    # UI
    "streamlit>=1.40",
    # Dataset parsing
    "pandas>=2.2",
    "pyreadstat>=1.2",
    # Embedding (D-4 v3: OpenAI text-embedding-3-small via LiteLLM; no local model)
    # Config
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    # Logging
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "neo4j>=6.2.0",
]
fallback = [
    # pyreadstat fallback if Apple Silicon build fails (R-20)
    "sas7bdat>=2.2",
]
browser = [
    # Only scripts/tests/test_webchat_cache_browser.py needs this: the webchat cache defect
    # is "the server serves the new file, the browser executes an old one", which no in-process
    # HTTP client can reproduce (none of them implement a cache). Its own extra rather than a
    # line in `dev` so that not having it is a visible skip on one file instead of a failure
    # everyone has to install their way out of. The browser binary is optional too: the test
    # falls back to the machine's installed Google Chrome.
    # Install additively (`uv pip install playwright`) — a `uv sync` against this lock would
    # uninstall the packages this venv carries beyond it, boto3 (Bedrock) among them.
    "playwright>=1.48",
]

[tool.setuptools]
packages = [
    "scripts",
    "scripts.chunkers",
    "scripts.shared",
    "scripts.study",
    "server",
    "ui",
    "eval",
]
package-dir = { "" = "." }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RET", "SIM"]
ignore = ["E501"]  # ruff format handles line length

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in parameter
# defaults (that is the framework's intended API), so B008 does not apply to them.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends", "fastapi.Body", "fastapi.Path", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "-ra -q"
markers = [
    # 起真实子进程 / 打真实外部 API 的慢测试。默认跑; 要跳过用 -m "not slow"。
    "slow: spawns real subprocesses or hits real APIs",
]
