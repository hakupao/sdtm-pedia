# Phase 1B5 Sanity Eval — 20 questions (15 main + 5 scientist Rule A)
# Format: id / category / question / expected_facts (substring match) / expected_sources (partial path match)
# Categories: single_domain (5) / cross_domain (5) / concept (5) / mixed (5)
# PLAN §5 Phase 1B5: 召回 ≥ 80% baseline

# ── Single Domain (5) ────────────────────────────────────────────────────

- id: q01
  category: single_domain
  question: "What is AETERM and what are its variable attributes in the AE domain?"
  expected_facts:
    - "Topic"
    - "Char"
    - "Req"
    - "Verbatim"
  expected_sources:
    - "domains/AE/spec.md"

- id: q02
  category: single_domain
  question: "What are the required (Core=Req) variables in the DM domain?"
  expected_facts:
    - "STUDYID"
    - "USUBJID"
    - "RFSTDTC"
    - "AGE"
    - "SEX"
    - "ARM"
  expected_sources:
    - "domains/DM/spec.md"

- id: q03
  category: single_domain
  question: "What are the key assumptions for adverse event data collection and coding?"
  expected_facts:
    - "AETERM"
    - "MedDRA"
    - "AEDECOD"
  expected_sources:
    - "domains/AE/assumptions.md"

- id: q04
  category: single_domain
  question: "What is the purpose of the TV (Trial Visits) domain and what variables does it contain?"
  expected_facts:
    - "VISITNUM"
    - "VISIT"
  expected_sources:
    - "domains/TV/spec.md"

- id: q05
  category: single_domain
  question: "In the PE (Physical Examination) domain, what is the structure of the dataset, what is the role of the PETESTCD variable, and what value should PETESTCD have when the results of the entire physical examination are represented in one record?"
  expected_facts:
    - "PETESTCD"
    - "Topic"
    - "PHYSEXAM"
  expected_sources:
    - "domains/PE/spec.md"

