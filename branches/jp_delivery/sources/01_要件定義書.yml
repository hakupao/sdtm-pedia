    rows:
      - ["BR-01", "規格の即時参照", "業務担当者が SDTM 変換業務遂行中の任意の場面において、SDTM 規格の該当部分を数十秒以内に参照可能であること。任意の Domain の定義および変数一覧、任意の変数の定義および許容値、任意のコントロールド・ターミノロジーのコードリストを含む。"]
      - ["BR-02", "原典追跡", "参照内容について、公式刊行物 (SDTMIG v3.4 PDF 等) の該当頁・節への追跡が常に可能であること。出典の付与されていない情報は許容しない。"]
      - ["BR-03", "AI 経由での高精度応答", "業務担当者が AI ツール経由で SDTM 関連質問を行った場合に、規格記述に整合した高精度な応答が得られること。回答に出典が付随し、規格に存在しない事項については推測ではなく「規格に記載なし」と明示されること。"]
      - ["BR-04", "組内および他組への展開", "本知識ベースが、統合 G 内のメンバー全員が同等に利用可能であり、将来的に関連業務組への展開も可能な形で構築されていること。"]
    note_rows: []

