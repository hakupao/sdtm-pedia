      - ["P-02", "利用者背景", "利用者は IT 分野および医療データ分野の双方に基本知識を有する実務担当者であること。基本的な臨床試験用語、Excel および Markdown の基本操作、業務関連規格への抵抗感のなさを想定する。"]
