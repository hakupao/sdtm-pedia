  # ─────────────────────────────────────────────
  # 1. 背景
  # ─────────────────────────────────────────────
  - name: "1_背景"
    type: "text"
    content_summary: "業務の概要、SDTM 規格参照の業務上の位置付け、本書の範囲"
    content: |
      1.1 業務の概要

      統合 G では、各臨床研究の電子データ収集 (EDC: Electronic Data Capture) システムから出力される CSV データを、CDISC 臨床試験データ表形式モデル (SDTM: Study Data Tabulation Model) の規格に従って変換する業務を担当している。

      本業務の遂行には、以下三領域の知識を統合的に参照する必要がある。

      ・各研究の試験実施計画書 (Protocol)
      ・臨床医療知識 (検査項目、診断、有害事象等)
      ・SDTM 規格 (SDTMIG v3.4、SDTM Model v2.0、CDISC Controlled Terminology)

      1.2 SDTM 規格参照の業務上の位置付け

      CSV から SDTM への変換の各場面で、SDTM 規格への参照が発生する。具体的には以下の場面である。

      ・Domain 判定: EDC 項目を SDTM の 63 ドメインのいずれに割り当てるかの判定。
      ・変数マッピング: SDTM 各変数の定義、Core 区分、許容値域への適合確認。
      ・コントロールド・ターミノロジー適用: 値が CDISC コントロールド・ターミノロジーのコードリストに整合するかの確認。
      ・業務前提確認: 各 Domain の業務上の前提 (Assumptions) との整合性確認。

      これらの参照判断の精度と速度は、変換業務全体の生産性と品質に直接影響する。

      1.3 本書の範囲

      本書は、上記業務における SDTM 規格参照を効率化および高精度化するための社内利用知識ベース (以下「本知識ベース」) について、業務上必要となる要件を定義する。本書は要件のみを定義し、実装方式は別途 02 基本設計書および 05 詳細設計書において定める。

  # ─────────────────────────────────────────────
  # 2. 業務上の課題
  # ─────────────────────────────────────────────
  - name: "2_業務上の課題"
    type: "text"
    content_summary: "現状の SDTM 規格参照における業務上の課題と影響"
    content: |
      2.1 SDTMIG v3.4 PDF 直接参照の負荷

      SDTMIG v3.4 公式刊行物は 461 頁の PDF として配布されており、業務担当者は必要時に該当部分を検索して参照している。しかし以下の負荷が日常的に発生している。

      ・任意の Domain、変数、用語の所在を特定するための時間的負荷 (461 頁の横断検索を要する)。
      ・PDF の構造上、用語間の関連 (例: SUPPQUAL と他 Domain の関係) を辿る際に複数頁の往復が必要となる。
      ・コントロールド・ターミノロジーは SDTMIG とは別の xlsx ファイルとして配布されており、PDF とのクロス参照が手作業となる。

      結果として、1 件の変数マッピング判断に対する規格参照に、数分から十数分を要する場面が生じる。

      2.2 既存 AI ツールによる参照の正答率問題

      上記の PDF 参照負荷の代替手段として、業務担当者は一般的な AI ツール (汎用大規模言語モデルを用いた対話型サービス等) に SDTM 関連質問を投げる運用も試行している。しかし以下の問題がある。

      ・回答の正答率が低く、SDTM 規格の実際の記述と異なる回答が頻繁に発生する。
      ・出典 (公式刊行物の該当頁) が提示されず、回答の真偽確認が別途必要となる。
      ・推測値と規格記述が混在し、判断材料としての信頼性が確保できない。
      ・コントロールド・ターミノロジーのコード (例: C コード) の正確性が担保されない。

      結果として、AI ツールの利用による効率化効果は限定的であり、最終的に PDF 直接参照に戻る場面が多い。

      2.3 業務影響

      上記 2.1 および 2.2 により、以下の業務影響が発生している。

      ・変換業務における規格参照工数の累積的増大。
      ・判断の確度の低下 (回答が規格に整合しているかを別途確認しないと信頼できない)。
      ・新規担当者の習熟期間の延長 (461 頁の PDF を体系的に学習する負担)。
      ・組内での参照経験の属人化 (個別担当者の探索ノウハウが暗黙知化する)。

  # ─────────────────────────────────────────────
  # 3. 目標利用者
  # ─────────────────────────────────────────────
  - name: "3_目標利用者"
    type: "text"
    content_summary: "本知識ベースの主要利用者および副次利用者"
    content: |
      3.1 主要利用者

      統合 G および将来的に同等業務を担当する社員。具体的には以下の役割を想定する。

      ・SDTM 変換業務担当: EDC 出力 CSV から SDTM への変換を主に担当する者。
      ・SDTM 品質確認担当: 変換結果の規格整合性を確認する者。

      主要利用者は以下の前提知識を有することを想定する。

      ・臨床試験データ管理業務の基本知識。
      ・SDTM の基本概念 (Domain、変数、Core 区分、Controlled Terminology)。
      ・業務関連規格に対する抵抗感のないこと。

      3.2 副次利用者

      主要利用者に加え、以下の副次利用者も想定する。

      ・SDTM 学習者: SDTM 規格を初めて学習する新規担当者または異動者。
      ・教育担当: 統合 G 内での SDTM 教育を実施する担当者。
      ・関連業務組: 将来的に SDTM 規格参照が必要となる他組のメンバー。

