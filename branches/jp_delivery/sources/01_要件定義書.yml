    headers: ["非機能要件 ID", "観点", "要件内容"]
    column_widths: [12, 18, 60]
    rows:
      - ["NFR-01", "完全性", "本知識ベースは SDTM 規格の業務参照に必要な範囲を完全に網羅する。プレースホルダ (TBD 等) は完成版に残さない。規格対応部分に対する網羅率を定量化して提示する。"]
      - ["NFR-02", "追跡可能性", "本知識ベースの任意の記述について、公式刊行物の該当頁・節への追跡を業務担当者が独立に実施可能であること。"]
      - ["NFR-03", "検索性能", "一般的な業務環境において、任意の参照対象に対する到達時間が数十秒以内であること。"]
      - ["NFR-04", "規制適合範囲の明示", "本知識ベースが、米国 21 CFR Part 11 または PMDA 電子記録・電子署名指針が要求する電磁的記録の代替ではないこと、および変換業務最終成果物 (SDTM データセット) に対する規制対応は別途必要であることを、利用者が誤認しないよう本知識ベース内に明示する。"]
      - ["NFR-05", "規格優先性の明示", "本知識ベースの記述と公式刊行物の記述に差異が見られた場合は公式刊行物が優先されることを、本知識ベース内に明示する。"]
    note_rows: []

