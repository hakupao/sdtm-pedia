      - ["FR-04", "多面検索機能", "BR-01", "Domain 名、変数名、コントロールド・ターミノロジー用語名、C コード等による多面検索を提供する。"]
      - ["FR-05", "共有参照経路提供機能", "BR-04", "組内全員が同等にアクセス可能な参照経路 (社内共有形式およびネットワーク経由参照) を提供する。"]
    note_rows: []

  # ─────────────────────────────────────────────
  # 6. 非機能要件
  # ─────────────────────────────────────────────
  - name: "6_非機能要件"
    type: "table"
